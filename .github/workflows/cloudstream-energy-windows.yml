name: SkyStream CloudStream + Energy Windows

on:
  push:
    branches:
      - cloudstream-local-backend
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloudstream-energy-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify and build combined Windows x64
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Check out SkyStream
        uses: actions/checkout@v5

      - name: Check out official CloudStream core
        uses: actions/checkout@v5
        with:
          repository: recloudstream/cloudstream
          ref: master
          path: .cloudstream-upstream

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Flutter project files
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Analyze combined source
        shell: pwsh
        run: flutter analyze --no-fatal-warnings

      - name: Test extensions and Energy Media Player integration
        shell: pwsh
        run: flutter test test/core/extensions test/features/extensions test/core/services/external_player_service_test.dart test/compile_smoke_test.dart

      - name: Build CloudStream JVM backend fat JAR
        shell: pwsh
        run: |
          & .\.cloudstream-upstream\gradlew.bat -p cloudstream_backend fatJar --stacktrace
          $jar = Get-ChildItem cloudstream_backend\build\libs -Filter '*-all.jar' | Select-Object -First 1
          if (-not $jar) { throw 'CloudStream backend fat JAR was not produced' }
          "SKYSTREAM_CLOUDSTREAM_JAR=$($jar.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Smoke-test Phisher JVM provider
        shell: pwsh
        run: |
          $backendLog = Join-Path $env:RUNNER_TEMP 'cloudstream-backend.log'
          $proc = Start-Process -FilePath java -ArgumentList @(
            '--add-modules','jdk.httpserver','-jar',$env:SKYSTREAM_CLOUDSTREAM_JAR,
            '--port','47831','--token','windows-ci-token'
          ) -RedirectStandardOutput $backendLog -RedirectStandardError "$backendLog.err" -PassThru
          try {
            $headers = @{ 'X-SkyStream-Token' = 'windows-ci-token' }
            $ready = $false
            for ($i = 0; $i -lt 40; $i++) {
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:47831/health' -Headers $headers -TimeoutSec 2
                if ($health.ok) { $ready = $true; break }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw 'CloudStream backend did not become healthy' }

            $plugins = Invoke-RestMethod -Uri 'https://raw.githubusercontent.com/phisher98/cloudstream-extensions-phisher/refs/heads/builds/plugins.json' -TimeoutSec 30
            $item = $plugins | Where-Object { $_.jarUrl } | Select-Object -First 1
            if (-not $item) { throw 'Phisher repository has no JVM jarUrl plugin' }
            $payload = @{
              name = $item.name
              internalName = $item.internalName
              url = $item.url
              jarUrl = $item.jarUrl
              jarHash = $item.jarHash
            } | ConvertTo-Json
            $install = Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:47831/plugins/install' -Headers $headers -ContentType 'application/json' -Body $payload -TimeoutSec 60
            if (-not $install.ok -or @($install.providers).Count -lt 1) {
              throw "Phisher JVM install failed: $($install | ConvertTo-Json -Compress)"
            }
            Write-Host "Phisher JVM providers: $(@($install.providers).name -join ', ')"
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Verify CNCVerse is routed to Stream X fallback
        shell: pwsh
        run: |
          $repo = Invoke-RestMethod -Uri 'https://raw.githubusercontent.com/NivinCNC/CNCVerse-Cloud-Stream-Extension/refs/heads/builds/CNC.json' -TimeoutSec 30
          $plugins = Invoke-RestMethod -Uri $repo.pluginLists[0] -TimeoutSec 30
          $androidOnly = $plugins | Where-Object { $_.url -and -not $_.jarUrl } | Select-Object -First 1
          if (-not $androidOnly) { throw 'Expected an Android-only CNCVerse plugin for bridge validation' }
          $controller = Get-Content lib\features\extensions\providers\extensions_controller.dart -Raw
          if ($controller -notmatch 'runtimeMode = ''bridge''') { throw 'Android-only bridge routing code is missing' }
          if ($controller -notmatch 'addonRepositoryProvider') { throw 'Stream X Add-ons integration is missing' }
          Write-Host "CNCVerse Android-only provider '$($androidOnly.name)' is delegated to enabled Stream X bridge manifests."

      - name: Keep only the Windows TorrServer binary
        shell: pwsh
        run: |
          Set-Location packages/flutter_torrent_server/assets/torrserver
          Get-ChildItem -File | Where-Object { $_.Name -ne 'TorrServer-windows-amd64.exe' } | Remove-Item

      - name: Download libmpv
        shell: pwsh
        run: |
          choco install 7zip -y --no-progress
          $assetPattern = '^mpv-dev-x86_64-(?!v\d+-)\d{8}-git-[a-f0-9]+\.7z$'
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest'
          $asset = $release.assets | Where-Object { $_.name -match $assetPattern } | Select-Object -First 1
          if (-not $asset) { throw "Could not find a libmpv asset matching $assetPattern" }
          $archivePath = Join-Path $env:RUNNER_TEMP 'mpv-dev.7z'
          $extractDir = Join-Path $env:RUNNER_TEMP 'mpv-dev-extract'
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $archivePath
          New-Item -ItemType Directory -Path $extractDir -Force | Out-Null
          & 7z x $archivePath "-o$extractDir" -y | Out-Null
          $dll = Get-ChildItem -Path $extractDir -Filter 'libmpv-2.dll' -Recurse | Select-Object -First 1
          if (-not $dll) { throw 'libmpv-2.dll was not found in the downloaded archive' }
          "SKYSTREAM_WINDOWS_MPV_DLL=$($dll.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Generate build configuration
        shell: bash
        run: |
          cat > dart-defines.json << 'JSON_EOF'
          {
            "TMDB_API_KEY": "${{ secrets.TMDB_API_KEY }}",
            "SIMKL_CLIENT_ID": "${{ secrets.SIMKL_CLIENT_ID }}",
            "SIMKL_CLIENT_SECRET": "${{ secrets.SIMKL_CLIENT_SECRET }}",
            "TRAKT_CLIENT_ID": "${{ secrets.TRAKT_CLIENT_ID }}",
            "TRAKT_CLIENT_SECRET": "${{ secrets.TRAKT_CLIENT_SECRET }}",
            "MAL_CLIENT_ID": "${{ secrets.MAL_CLIENT_ID }}",
            "MAL_CLIENT_SECRET": "${{ secrets.MAL_CLIENT_SECRET }}",
            "ANILIST_CLIENT_ID": "${{ secrets.ANILIST_CLIENT_ID }}",
            "ANIMESKIP_CLIENT_ID": "${{ secrets.ANIMESKIP_CLIENT_ID }}"
          }
          JSON_EOF

      - name: Build Windows release
        shell: pwsh
        run: flutter build windows --release --dart-define-from-file=dart-defines.json

      - name: Bundle CloudStream backend and minimal Java runtime
        shell: pwsh
        run: |
          $releaseDir = Resolve-Path 'build\windows\x64\runner\Release'
          $backendDir = Join-Path $releaseDir 'cloudstream-backend'
          $runtimeDir = Join-Path $backendDir 'runtime'
          New-Item -ItemType Directory -Path $backendDir -Force | Out-Null
          Copy-Item $env:SKYSTREAM_CLOUDSTREAM_JAR (Join-Path $backendDir 'backend.jar')
          & "$env:JAVA_HOME\bin\jlink.exe" `
            --add-modules java.base,java.desktop,java.logging,java.management,java.net.http,java.naming,java.sql,java.xml,jdk.crypto.ec,jdk.httpserver,jdk.unsupported `
            --strip-debug --no-header-files --no-man-pages --compress=2 `
            --output $runtimeDir
          if (-not (Test-Path (Join-Path $runtimeDir 'bin\java.exe'))) { throw 'Bundled Java runtime missing java.exe' }
          if (-not (Test-Path (Join-Path $backendDir 'backend.jar'))) { throw 'Bundled backend.jar missing' }

      - name: Build installer and portable ZIP
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $appDir = '..\..\..\build\windows\x64\runner\Release'
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' /DAppVersion=2.7.6-cloudstream-pc /DAppArch=x64 /DAppDir=$appDir windows\packaging\exe\setup.iss
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath SkyStream-CloudStream-Energy-Windows-x64-Portable.zip

      - name: Stage outputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifact -Force | Out-Null
          Copy-Item windows\packaging\exe\Output\*.exe artifact\
          Copy-Item SkyStream-CloudStream-Energy-Windows-x64-Portable.zip artifact\
          Get-ChildItem artifact | Format-Table Name,Length

      - name: Upload unscanned build
        uses: actions/upload-artifact@v4
        with:
          name: skystream-cloudstream-energy-windows-unscanned
          path: artifact/
          retention-days: 3

  malware-scan:
    name: ClamAV scan and checksums
    needs: verify-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: skystream-cloudstream-energy-windows-unscanned
          path: artifact

      - name: Install and update ClamAV
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav
          sudo systemctl stop clamav-freshclam.service || true
          sudo freshclam

      - name: Scan and create SHA-256 checksums
        working-directory: artifact
        run: |
          clamscan --recursive --infected --log=CLAMAV-SCAN.txt .
          sha256sum *.exe *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload verified build
        uses: actions/upload-artifact@v4
        with:
          name: SkyStream-CloudStream-Energy-Windows-x64-verified
          path: artifact/
          retention-days: 14

      - name: Publish verified GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="cloudstream-pc-v0.1.${{ github.run_number }}"
          gh release create "$tag" artifact/*.exe artifact/*.zip artifact/SHA256SUMS.txt artifact/CLAMAV-SCAN.txt \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "SkyStream CloudStream PC $tag" \
            --prerelease \
            --notes "Combined Windows test build: SkyStream + Energy Media Player handoff + local CloudStream JVM runtime. Phisher JVM provider is CI-tested. Android-only CloudStream plugins such as CNCVerse are delegated to an enabled Stream X bridge add-on; install your Stream X manifest in SkyStream Add-ons before installing those providers."
