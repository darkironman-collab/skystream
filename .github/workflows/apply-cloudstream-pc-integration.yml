name: Apply CloudStream PC Integration

on:
  workflow_dispatch:
  push:
    branches:
      - cloudstream-local-backend
    paths:
      - tools/apply_cloudstream_pc_integration.py
      - .github/workflows/apply-cloudstream-pc-integration.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: cloudstream-local-backend
          fetch-depth: 0

      - name: Apply anchored source patch
        run: python3 tools/apply_cloudstream_pc_integration.py

      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Patch already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/core/extensions/services/plugin_storage_service.dart \
            lib/features/extensions/providers/extensions_controller.dart \
            lib/core/extensions/extension_manager.dart \
            lib/core/extensions/services/cloudstream_backend_service.dart
          git commit -m 'fix: route CloudStream installs through runtime and bridge'
          git push origin HEAD:cloudstream-local-backend
